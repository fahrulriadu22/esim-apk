name: esim_application
description: "eSIM Marketplace Flutter Application - Buy and manage eSIM data plans for international travel"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Network
  http: ^1.2.1
  url_launcher: ^6.2.4
  connectivity_plus: ^6.0.3

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.1.4

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1

  # Storage & Cache
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Localization
  easy_localization: ^3.0.5

  # Firebase
  firebase_core: ^2.30.1
  firebase_analytics: ^10.10.3
  firebase_crashlytics: ^3.5.3

  # RevenueCat
  purchases_flutter: ^6.28.0

  # Utilities
  intl: ^0.20.2
  json_annotation: ^4.9.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/